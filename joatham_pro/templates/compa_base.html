
{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <title>{% trans "Comptabilité" %}</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: #1e293b;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 10px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #334155;
            color: white;
        }

        .content {
            flex: 1;
            padding: 20px;
            background: #f1f5f9;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>{% trans "📊 Comptabilité" %}</h2>

    <a href="/compta/">{% trans "🏠 Dashboard" %}</a>
    <a href="/compta/resultat/">{% trans "📈 Résultat" %}</a>
    <a href="/compta/bilan/">{% trans "📊 Bilan" %}</a>
    <a href="/compta/grand-livre/">{% trans "📒 Grand Livre" %}</a>
    <a href="/compta/balance/">{% trans "📋 Balance" %}</a>
</div>

<div class="content">
    {% block content %}{% endblock %}
</div>

</body>
</html>
