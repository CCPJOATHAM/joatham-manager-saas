# Include INSIDE EVERY public server {} that previously exposed MEDIA_ROOT.
# REPLACE its existing location /media/; do not add a duplicate location.
# Files stay in place. Django streams authorized private downloads.
# Adapt this path only after verifying the effective MEDIA_ROOT on that host.

location = /media {
    return 404;
}

# Only company logos are deliberately public. ^~ avoids regex locations
# overriding the allowlist. Disable symlinks to other parts of mixed storage.
location ^~ /media/entreprises/logos/ {
    alias /home/joatham/apps/joatham_saas/media/entreprises/logos/;
    autoindex off;
    disable_symlinks on;
    limit_except GET HEAD { deny all; }
    add_header X-Content-Type-Options nosniff always;
}

# Includes old payment proofs, subscription evidence, messages and profiles.
# Do not replace this with a public alias or a proxy to an unguarded file view.
location ^~ /media/ {
    add_header Cache-Control "private, no-store" always;
    return 404;
}
